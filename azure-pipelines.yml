trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '8.x'

  - script: dotnet restore backend/EmployeeTracker.Api/EmployeeTracker.Api.csproj
    displayName: 'Restore backend'

  - script: dotnet build backend/EmployeeTracker.Api/EmployeeTracker.Api.csproj -c $(buildConfiguration) --no-restore
    displayName: 'Build backend'

  - script: dotnet publish backend/EmployeeTracker.Api/EmployeeTracker.Api.csproj -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/backend --no-build
    displayName: 'Publish backend'

  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'
    displayName: 'Use Node.js 18.x'

  - script: npm ci
    workingDirectory: frontend/employee-tracker-ui
    displayName: 'Install frontend deps'

  - script: npx ng build --configuration production
    workingDirectory: frontend/employee-tracker-ui
    displayName: 'Build frontend'

  - task: CopyFiles@2
    inputs:
      SourceFolder: 'frontend/employee-tracker-ui/dist'
      Contents: '**/*'
      TargetFolder: '$(Build.ArtifactStagingDirectory)/frontend'
    displayName: 'Stage frontend artifact'

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'drop'
      publishLocation: 'Container'
